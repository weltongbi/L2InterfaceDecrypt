name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Usa vswhere + VsDevCmd (x86) + Ninja: funciona com qualquer
      # versão de Visual Studio instalada no runner (17, 18, ...).
      - name: Build (MSVC x86 + Ninja)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { Write-Error "Visual Studio with C++ tools not found"; exit 1 }
          Write-Host "Visual Studio: $vsPath"

          # Carrega o ambiente do toolchain x86
          cmd /c "`"$vsPath\Common7\Tools\VsDevCmd.bat`" -arch=x86 -host_arch=x64 >nul && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
              }
            }

          # Garante o Ninja (do VS ou do PATH)
          $ninjaDir = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
          if (Test-Path $ninjaDir) { $env:PATH = "$ninjaDir;$env:PATH" }

          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Empacota o release: l2ui.zip com a DLL + o template do INI.
      - name: "Package (l2ui.zip: l2ui.dll + l2ui.ini.example)"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build\l2ui.dll dist\
          Copy-Item l2ui.ini.example dist\
          Compress-Archive `
            -Path "dist\l2ui.dll", "dist\l2ui.ini.example" `
            -DestinationPath "dist\l2ui.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: l2ui
          path: |
            build/l2ui.dll
            build/l2ui.pdb
            dist/l2ui.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/l2ui.zip
            build/l2ui.pdb
